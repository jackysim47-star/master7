name: Refresh Render V17 package

on:
  push:
    branches:
      - codex/v17-render-staging-20261104
    paths:
      - app/portal.html
      - lib/backend.ts
      - public/assets/template-v173.css
      - .github/render-package-overlay.tar.gz
      - .github/workflows/refresh-render-package.yml

concurrency:
  group: refresh-render-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          # Pin the package job to the commit that triggered it. If the branch
          # advances while this job runs, the final push fails safely instead
          # of overwriting a newer verified release artifact.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Overlay the verified V173 template into the Render package
        shell: bash
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          tar -xzf master7-v17-render-staging.tar.gz -C "$work_dir"
          package_dir="$work_dir/master7-v17-render-staging"
          tar -xzf .github/render-package-overlay.tar.gz -C "$package_dir"
          # The overlay contains historical copies of these files. Install the
          # canonical source versions last so a delayed workflow cannot remove
          # reconciliation UI/API functionality from a newer package.
          install -D -m 0644 app/portal.html "$package_dir/app/portal.html"
          install -D -m 0644 lib/backend.ts "$package_dir/lib/backend.ts"
          install -D -m 0644 public/assets/template-v173.css "$package_dir/public/assets/template-v173.css"
          (
            cd "$package_dir"
            corepack pnpm install --frozen-lockfile
            node --test tests/finance-ui.test.mjs tests/finance-center-api.test.mjs
            rm -rf node_modules .sites-runtime
          )
          tar -czf "$work_dir/render-package.tar.gz" -C "$work_dir" master7-v17-render-staging
          if cmp -s "$work_dir/render-package.tar.gz" master7-v17-render-staging.tar.gz; then
            echo "Render package is already current."
            exit 0
          fi
          mv "$work_dir/render-package.tar.gz" master7-v17-render-staging.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master7-v17-render-staging.tar.gz
          git commit -m "chore: refresh Render staging package [skip ci]"
          git push origin HEAD:codex/v17-render-staging-20261104
