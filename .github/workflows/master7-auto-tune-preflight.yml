name: Master7 Auto Tune preflight

on:
  push:
    branches: [codex/master7-auto-tune-reachability-20261125]
    paths: [.github/workflows/master7-auto-tune-preflight.yml]

permissions:
  contents: read

jobs:
  public_checks:
    name: Read-only public entrance checks
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      results: ${{ steps.probe.outputs.results }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - id: probe
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';
          import { monitor } from './standalone/production-operations.mjs';

          const healthUrls = new Map([
            ['https://www.master7.best/health', 'front'],
            ['https://admin.master7.best/health', 'admin'],
          ]);
          const releases = new Map();
          const observations = new Map();
          let aliasHost = '';
          const publicErrorCodes = new Map([
            ['ENOTFOUND', 'DNS'], ['EAI_AGAIN', 'DNS_TEMP'],
            ['CERT_HAS_EXPIRED', 'CERT_EXPIRED'], ['ERR_TLS_CERT_ALTNAME_INVALID', 'CERT_HOST'],
            ['UNABLE_TO_VERIFY_LEAF_SIGNATURE', 'CERT_CHAIN'], ['DEPTH_ZERO_SELF_SIGNED_CERT', 'CERT_CHAIN'],
            ['ECONNREFUSED', 'REFUSED'], ['ECONNRESET', 'RESET'], ['UND_ERR_CONNECT_TIMEOUT', 'TIMEOUT'],
          ]);
          const results = await monitor({
            env: { OPERATIONS_GATEWAY_ORIGIN: 'https://master7-integration-gateway.onrender.com' },
            fetchImpl: async (url, options) => {
              let response;
              try {
                response = await fetch(url, options);
              } catch (error) {
                const code = error?.name === 'TimeoutError' ? 'TIMEOUT' : publicErrorCodes.get(error?.cause?.code) ?? 'CONNECT';
                observations.set(url, code);
                throw error;
              }
              observations.set(url, String(response.status));
              if (url === 'https://www.master7.site/') {
                const location = response.headers.get('location');
                const hostname = location ? URL.parse(location, url)?.hostname : '';
                aliasHost = hostname && /^[a-z0-9.-]{1,60}$/.test(hostname) ? hostname : '';
              }
              const key = healthUrls.get(url);
              if (key && response.ok) {
                const data = await response.clone().json().catch(() => null);
                if (typeof data?.release === 'string' && /^[a-f0-9]{40}$/.test(data.release)) {
                  releases.set(key, data.release);
                }
              }
              return response;
            },
          });
          const labels = new Map([
            ['customer_health', ['Front', 'https://www.master7.best/health']],
            ['customer_signin', ['FrontLogin', 'https://www.master7.best/signin']],
            ['admin_health', ['Admin', 'https://admin.master7.best/health']],
            ['admin_signin', ['AdminLogin', 'https://admin.master7.best/signin']],
            ['customer_alias_redirect', ['Alias', 'https://www.master7.site/']],
            ['gateway_health', ['Gateway', 'https://master7-integration-gateway.onrender.com/health']],
          ]);
          const checks = results.filter(result => labels.has(result.name));
          const compactCode = result => {
            if (result.ok) return 'OK';
            const failure = result.failures.at(-1);
            const observed = observations.get(labels.get(result.name)[1]);
            if (failure === 'UNEXPECTED_RESPONSE') return `${observed ?? 'HTTP'}_MISMATCH`;
            return observed ?? 'FAIL';
          };
          const label = checks.map(result => `${labels.get(result.name)[0]}=${compactCode(result)}`).join(' ');
          const versions = ['front', 'admin'].map(key => `${key}=${releases.get(key)?.slice(0, 12) ?? 'unknown'}`).join(' ');
          const lines = checks.map(result => `- ${result.name} · ${compactCode(result)} · ${result.durationMs.join(' / ')} ms · ${result.failures.join(', ') || 'OK'}`);
          const revisions = [...releases].map(([name, release]) => `- ${name} release · ${release}`);
          await appendFile(process.env.GITHUB_STEP_SUMMARY, [...lines, ...revisions].join('\n') + '\n');
          const alias = aliasHost ? ` | aliasHost=${aliasHost}` : '';
          await appendFile(process.env.GITHUB_OUTPUT, `results=${label} | ${versions}${alias}\n`);
          NODE

  result:
    name: ${{ needs.public_checks.outputs.results }}
    needs: public_checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'Probe results recorded in the job name and summary.'
