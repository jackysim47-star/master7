# MASTER7 V17 production service adoption.
# Existing environment variables, secrets, compute plan, and database wiring
# are intentionally omitted so Render preserves them unchanged.
previews:
  generation: 'off'

services:
  - type: web
    name: master7-v17-production
    runtime: node
    region: singapore
    repo: https://github.com/jackysim47-star/master7
    branch: release/v17.3-production
    autoDeployTrigger: 'off'
    numInstances: 1
    renderSubdomainPolicy: enabled
    buildCommand: >-
      set -e; mkdir -p .render-v17; tar -xzf master7-v17-render-staging.tar.gz -C .render-v17;
      install -D -m 0644 production/lib/portal-host-routing.ts .render-v17/master7-v17-render-staging/lib/portal-host-routing.ts;
      install -D -m 0644 production/tests/portal-host-routing.test.mjs .render-v17/master7-v17-render-staging/tests/portal-host-routing.test.mjs;
      cd .render-v17/master7-v17-render-staging; corepack pnpm install --frozen-lockfile;
      corepack pnpm run test:render-db; corepack pnpm run build:render
    startCommand: cd .render-v17/master7-v17-render-staging && node scripts/start-render.mjs
    healthCheckPath: /health/live
    domains:
      - www.master7.best
      - www.master7.site
