# Plan-only until the exact Render adoption preview is reviewed and authorized.
# Existing environment variables are deliberately omitted and preserved.
# Render rejects staticPublishPath for native Node; adoption clears that unused legacy metadata.
previews:
  generation: 'off'
services:
- type: web
  name: master7-v17-staging
  runtime: node
  region: singapore
  plan: 2c-4g
  repo: https://github.com/jackysim47-star/master7
  branch: codex/v17-render-staging-20261104
  autoDeployTrigger: 'off'
  numInstances: 1
  renderSubdomainPolicy: enabled
  buildCommand: set -e; mkdir -p .render-v17; tar -xzf master7-v17-render-staging.tar.gz -C .render-v17; cd .render-v17/master7-v17-render-staging; corepack pnpm
    install --frozen-lockfile; corepack pnpm run test:render-db; corepack pnpm run build:render
  startCommand: cd .render-v17/master7-v17-render-staging && node scripts/start-render.mjs
  healthCheckPath: /health/live
  domains:
  - www.master7.best
  - www.master7.site
